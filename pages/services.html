    <title>Услуги</title>

  <body>
    <header>
      <nav>
        <ul class="menu">
          <li><a href="index.html">Главная</a></li>

        <div class="order-form">
          <h2>Форма заказа</h2>
          <form>
            <div class="form">
              <input type="text" name="name" placeholder="Ваше имя" required />
              <input type="email" name="email" placeholder="Ваш email" required />
              <input type="text" name="product" placeholder="Название продукта" required />
              <textarea name="message" placeholder="Дополнительная информация" rows="4"></textarea>
            </div>
            <div class="btn-form">
              <button type="submit">Отправить заказ</button>
            </div>
          </form>
        </div>
      </div>
    </main>
